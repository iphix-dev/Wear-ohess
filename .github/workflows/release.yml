name: Build & Release APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer plateforme SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compiler les deux APK (debug, signature debug)
        run: gradle :app:assemblePhoneDebug :app:assembleWatchDebug --no-daemon

      - name: Renommer les APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/phone/debug/app-phone-debug.apk out/WristRelay-phone.apk
          cp app/build/outputs/apk/watch/debug/app-watch-debug.apk out/WristRelay-watch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WristRelay-apks
          path: out/*.apk

      - name: Joindre les APK à la release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
